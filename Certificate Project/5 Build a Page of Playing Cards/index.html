<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>

</head>

<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle">
                <div>♠</div>
            </div>
            <div class="right">
                <div class="flipped">♠</div>
                <div class="flipped">A</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div>2</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div>♣</div>
                <div class="flipped">♣</div>
            </div>
            <div class="right">
                <div class="flipped">♣</div>
                <div class="flipped">2</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div>J</div>
                <div>♥</div>
            </div>
            <div class="middle">
                <div>♥</div>
            </div>
            <div class="right">
                <div class="flipped">♥</div>
                <div class="flipped">J</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div>4</div>
                <div>♦</div>
            </div>
            <div class="middle">
                <div class="middle-section">
                    <div>♦</div>
                    <div>♦</div>
                </div>
                <div class="middle-section">
                    <div>♦</div>
                    <div>♦</div>
                </div>
            </div>
            <div class="right">
                <div class="flipped">♦</div>
                <div class="flipped">4</div>
            </div>
        </div>
    </main>
</body>

</html>
